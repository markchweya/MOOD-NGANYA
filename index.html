<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MOOD — No Risk, No Story</title>
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="MOOD, Nairobi's purple nganya. Front says TRY ME, back says ATMOSPHERE. Explore every detail, colour, sticker and video."
    />
    <meta name="theme-color" content="#12051b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f2fb" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MOOD — No Risk, No Story" />
    <meta
      property="og:description"
      content="Nairobi's purple nganya. Front says TRY ME. Back says ATMOSPHERE."
    />
    <meta property="og:url" content="https://markchweya.github.io/MOOD-NGANYA/" />
    <meta property="og:image" content="https://markchweya.github.io/MOOD-NGANYA/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Resolve the theme before first paint so the page never flashes the wrong one.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("mood-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
